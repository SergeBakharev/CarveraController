name: Build and Release
on:
  push:
    branches:
      - develop
    tags:
      - "v*.*.*"

jobs:
  build-windows-artifacts:
    name: build-windows-${{ matrix.platform }}
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [win64]
        include:
          - platform: win64
            arch: x64
    defaults:
      run:
        shell: bash
    env:
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'carvera-controller-community' }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
      SIGNPATH_WINDOWS_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_WINDOWS_ARTIFACT_CONFIGURATION_SLUG || 'windows-portable-exe' }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
        architecture: ${{ matrix.arch }}

    - name: Install poetry and dependencies
      uses: ./.github/actions/bootstrap-poetry
      with:
        os: windows

    - uses: git-for-windows/setup-git-for-windows-sdk@v1
      with:
        flavor: minimal
      # We install git-for-windows so as to have access to the msgfmt.exe binary
      # from the GNU gettext package.

    - name: "Install Windows-Mesa OpenGL DLL"
      run: |
        curl -L --output mesa.7z --url https://github.com/pal1000/mesa-dist-win/releases/download/24.2.5/mesa3d-24.2.5-release-msvc.7z
        7z x mesa.7z -o*
        powershell.exe mesa\\systemwidedeploy.cmd 1
    # PyInstaller needs to be able to run the python app to determine the dependencies
    # This can't be done without a graphics renderer, so we install the Windows-Mesa OpenGL DLL
    # to proviode that.

    - name: Build release
      shell: pwsh
      run: |
        if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
          $version = $env:GITHUB_REF_NAME
        } else {
          $version = Get-Date -Format "yyyy.M.d"
        }
        poetry run python scripts/build.py --os windows --version $version

    - name: Upload unsigned artifact for SignPath
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      id: upload-unsigned
      uses: actions/upload-artifact@v4
      with:
        name: windows-unsigned-${{ matrix.platform }}
        path: ${{ github.workspace }}/dist/carveracontroller-community-*-windows-x64.exe
        retention-days: 1

    - name: Submit SignPath test-signing request
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      id: signpath
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
        artifact-configuration-slug: ${{ env.SIGNPATH_WINDOWS_ARTIFACT_CONFIGURATION_SLUG }}
        github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 1800
        output-artifact-directory: ${{ github.workspace }}/signed

    - name: Replace unsigned EXE with SignPath-signed EXE
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      shell: pwsh
      run: |
        $signed = Get-ChildItem -Path signed -Recurse -Filter "carveracontroller-community-*-windows-x64.exe" |
          Select-Object -First 1
        if (-not $signed) {
          Get-ChildItem -Path signed -Recurse -ErrorAction SilentlyContinue | Format-Table FullName
          throw "Signed Windows EXE was not returned by SignPath"
        }
        Copy-Item $signed.FullName -Destination dist -Force
        Write-Host "Copied signed EXE: $($signed.FullName)"

    - name: Verify Authenticode signature
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      shell: pwsh
      run: |
        $exe = Get-ChildItem -Path dist -Filter "carveracontroller-community-*-windows-x64.exe" | Select-Object -First 1
        if (-not $exe) { throw "Windows EXE not found in dist/" }
        $sig = Get-AuthenticodeSignature $exe.FullName
        $sig | Format-List *
        if ($null -eq $sig.SignerCertificate) {
          throw "EXE is not Authenticode-signed"
        }
        $summary = @(
          "## Windows SignPath test-signing",
          "- File: $($exe.Name)",
          "- Signer: $($sig.SignerCertificate.Subject)",
          "- Status: $($sig.Status) (NotTrusted is expected for a self-signed test certificate)",
          "- Signing request: ${{ steps.signpath.outputs.signing-request-web-url }}"
        ) -join "`n"
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-assets-${{ matrix.platform }}
        path: ${{ github.workspace }}/dist/carveracontroller-community-*-windows-x64.exe
        retention-days: 2

  build-macos-artifacts:
    name: build-macos-${{ matrix.platform }}
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ Intel, AppleSilicon ]
        include:
          - platform: Intel
            image: macos-15-intel
          - platform: AppleSilicon
            image: macos-14
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install poetry and dependencies
      uses: ./.github/actions/bootstrap-poetry
      with:
        os: macos

    - name: Install create-dmg
      run: brew install create-dmg

    - name: Build release
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=$GITHUB_REF_NAME
        else
          VERSION=$(date +'%Y.%m.%d')
        fi
        poetry run python scripts/build.py --os macos --version "$VERSION"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-assets-${{ matrix.platform }}
        path: ${{ github.workspace }}/dist/carveracontroller-community-*.dmg
        retention-days: 2

  build-ios-app:
    name: build-ios
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/heads/develop')
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4

    - name: Cache build directory
      uses: actions/cache@v4
      with:
        path: |
          build
          dist
        key: ${{ runner.os }}-ios-build-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-ios-build-

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install poetry and dependencies
      uses: ./.github/actions/bootstrap-poetry
      with:
        os: ios

    - name: Build release
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=$GITHUB_REF_NAME
        else
          VERSION=$(date +'%Y.%m.%d')
        fi
        poetry run python scripts/build.py --os ios --version "$VERSION"

  build-linux-artifacts:
    name: build-linux-${{ matrix.platform }}
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        platform: [x64,arm64]
        include:
          - platform: x64
            image: ubuntu-22.04
          - platform: arm64
            image: ubuntu-22.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install poetry and dependencies
        uses: ./.github/actions/bootstrap-poetry
        with:
          os: linux

      - name: Install Linux prerequisites
        run: poetry run ./scripts/install_linux_prereqs.sh

      - name: Build release
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=$GITHUB_REF_NAME
          else
            VERSION=$(date +'%Y.%m.%d')
          fi
          xvfb-run poetry run python scripts/build.py --os linux --version "$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets-${{ matrix.platform }}
          path: ${{ github.workspace }}/dist/carveracontroller-community-*.appimage
          retention-days: 2

  build-pypi-artifacts:
    name: build-python
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # all history is required for the dynamic versioning plugin

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install poetry and dependencies
      uses: ./.github/actions/bootstrap-poetry
      with:
        os: linux

    - name: Install gettext
      run: sudo apt-get install -y gettext

    - name: Build release
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=$GITHUB_REF_NAME
        else
          VERSION=$(date +'%Y.%m.%d')
        fi
        poetry run python scripts/build.py --os pypi --version "$VERSION"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pypi-assets
        path: ${{ github.workspace }}/dist/*.whl
        retention-days: 2

    - name: Publish package to PyPI
      if: startsWith(github.ref, 'refs/tags/')
      uses: pypa/gh-action-pypi-publish@release/v1

  build-android-artifacts:
    name: build-android
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    env:
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'carvera-controller-community' }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
      SIGNPATH_ANDROID_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ANDROID_ARTIFACT_CONFIGURATION_SLUG || 'android-apk' }}
    steps:
    - uses: actions/checkout@v4

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-global
        restore-keys: |
          ${{ runner.os }}-buildozer-global

    - name: Cache Buildozer directory in app
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-app
        restore-keys: |
          ${{ runner.os }}-buildozer-app

    - name: Cache Android SDK
      uses: actions/cache@v4
      with:
        path: ~/.buildozer/android/platform/android-sdk
        key: ${{ runner.os }}-android-sdk
        restore-keys: |
          ${{ runner.os }}-android-sdk

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install poetry and dependencies
      uses: ./.github/actions/bootstrap-poetry
      with:
        os: linux

    - name: Install Linux prerequisites
      run: poetry run ./scripts/install_linux_prereqs.sh

    # Set up Java 17 required by Gradle
    - name: Setup Java 17 required by Gradle
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'  # or 'zulu', 'liberica', etc.
        java-version: '17'

    - name: Install prereqs
      run: |
        poetry run ./scripts/install_android_prereqs.sh

    - name: Build release
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=$GITHUB_REF_NAME
        else
          VERSION=$(date +'%Y.%m.%d')
        fi
        xvfb-run poetry run python scripts/build.py --os android --version "$VERSION" --automation

    - name: Upload unsigned APK for SignPath
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      id: upload-unsigned-apk
      uses: actions/upload-artifact@v4
      with:
        name: android-unsigned
        path: ${{ github.workspace }}/dist/carveracontroller-community-*.apk
        retention-days: 1

    - name: Submit SignPath test-signing request
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      id: signpath-apk
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
        artifact-configuration-slug: ${{ env.SIGNPATH_ANDROID_ARTIFACT_CONFIGURATION_SLUG }}
        github-artifact-id: ${{ steps.upload-unsigned-apk.outputs.artifact-id }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 1800
        output-artifact-directory: ${{ github.workspace }}/signed

    - name: Replace unsigned APK with SignPath-signed APK
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      run: |
        set -euo pipefail
        signed_apk="$(find "${GITHUB_WORKSPACE}/signed" -type f -name 'carveracontroller-community-*.apk' | head -n 1)"
        if [ -z "${signed_apk}" ]; then
          echo "Signed Android APK was not returned by SignPath" >&2
          find "${GITHUB_WORKSPACE}/signed" -print >&2 || true
          exit 1
        fi
        cp "${signed_apk}" "${GITHUB_WORKSPACE}/dist/"
        echo "Copied signed APK: ${signed_apk}"

    - name: Verify APK signature
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      run: |
        set -euo pipefail
        apk="$(ls -1 dist/carveracontroller-community-*.apk | head -n 1)"
        apksigner="$(find "${HOME}/.buildozer/android/platform/android-sdk/build-tools" -name apksigner -type f | sort | tail -n 1)"
        if [ -z "${apksigner}" ]; then
          echo "apksigner not found; falling back to jarsigner -verify"
          jarsigner -verify -verbose -certs "${apk}"
        else
          "${apksigner}" verify --verbose --print-certs "${apk}"
        fi
        {
          echo "## Android SignPath test-signing"
          echo "- File: \`${apk##*/}\`"
          echo "- Signing request: ${{ steps.signpath-apk.outputs.signing-request-web-url }}"
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-assets
        path: ${{ github.workspace }}/dist/carveracontroller-community-*.apk
        retention-days: 2

  build-docker-images:
    name: build-docker-images
    needs: [build-linux-artifacts]
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            image: ubuntu-24.04
          - platform: arm64
            image: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux AppImage artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-assets-${{ matrix.platform }}
          path: ./artifacts/

      - name: Copy AppImage to Docker build context
        run: |
          mkdir -p assets/packaging/Docker/artifacts/
          cp ./artifacts/*.appimage assets/packaging/Docker/artifacts/

      # TODO: Add support for more platforms with QEMU
      # https://github.com/docker/setup-qemu-action
      #- name: Set up QEMU
      #  uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/carvera-controller-${{ matrix.platform }}
          tags: |
            type=ref,event=tag
            type=raw,value=dev,enable=${{ github.ref == format('refs/heads/{0}', 'develop') }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: assets/packaging/Docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/${{ matrix.platform == 'x64' && 'amd64' || matrix.platform }}

  publish-release:
    needs: [ build-windows-artifacts, build-macos-artifacts, build-linux-artifacts, build-pypi-artifacts ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Deleting the old dev release means that on the Publish release step a new dev release is created putting it in the right chronological order
      - name: Delete old dev release (dev builds only)  
        if: startsWith(github.ref, 'refs/heads/develop')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if dev release exists and delete it
          if gh release view dev --repo ${{ github.repository }} 2>/dev/null; then
            gh release delete dev --repo ${{ github.repository }} --yes
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:  # Skip downloading docker images
          pattern: '*-assets*'

      - name: Generate dev release notes (dev builds only)
        if: startsWith(github.ref, 'refs/heads/develop')
        run: python3 ./scripts/dev_release_notes.py

      - name: Force move 'dev' tag to latest commit on develop (dev builds only)
        if: startsWith(github.ref, 'refs/heads/develop')
        run: |
          git tag -f dev
          git push origin dev --force

      - name: Publish release  # All but android artifacts
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: |
            windows-assets-*/carveracontroller-community-*-windows-x64.exe
            macos-assets-*/carveracontroller-community-*.dmg
            linux-assets-*/carveracontroller-community-*.appimage
            pypi-assets/*.whl
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
          body_path: ${{ startsWith(github.ref, 'refs/tags/') && 'CHANGELOG.md' || 'dev-CHANGELOG.md' }} 
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && 'false' || 'true' }}

  publish-android-release:
    needs: [ build-android-artifacts, publish-release ]  # depends on publish-release to delete previous release/tags
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:  # Skip downloading docker images
          pattern: '*-assets*'
      
      - name: Generate dev release notes (dev builds only)
        if: startsWith(github.ref, 'refs/heads/develop')
        run: python3 ./scripts/dev_release_notes.py

      - name: Publish Android release
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: android-assets/carveracontroller-community-*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
          body_path: ${{ startsWith(github.ref, 'refs/tags/') && 'CHANGELOG.md' || 'dev-CHANGELOG.md' }} 
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && 'false' || 'true' }} 