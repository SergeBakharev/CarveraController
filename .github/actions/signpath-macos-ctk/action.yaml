name: 'Start SignPath CryptoTokenKit'
description: 'Install SignPath CryptoTokenKit and load the signing certificate into the macOS keychain'
inputs:
  api-token:
    description: 'SignPath API token'
    required: true
  organization-id:
    description: 'SignPath organization ID'
    required: true
  project-slug:
    description: 'SignPath project slug'
    required: true
  signing-policy-slug:
    description: 'SignPath signing policy slug'
    required: true
  certificate-subject-name:
    description: 'Common Name (or unique substring) of the SignPath certificate'
    required: true
outputs:
  codesign-identity:
    description: 'Value to pass to codesign -s (hash or certificate Common Name)'
    value: ${{ steps.start.outputs.codesign-identity }}
runs:
  using: composite
  steps:
    - name: Install and start SignPath CryptoTokenKit
      id: start
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SIGNPATH_API_TOKEN: ${{ inputs.api-token }}
        SIGNPATH_ORGANIZATION_ID: ${{ inputs.organization-id }}
        SIGNPATH_PROJECT_SLUG: ${{ inputs.project-slug }}
        SIGNPATH_SIGNING_POLICY_SLUG: ${{ inputs.signing-policy-slug }}
        SIGNPATH_CERTIFICATE_SUBJECT_NAME: ${{ inputs.certificate-subject-name }}
      run: |
        set -euo pipefail

        if [ -z "${SIGNPATH_API_TOKEN}" ]; then
          echo "SIGNPATH_API_TOKEN is not set" >&2
          exit 1
        fi
        if [ -z "${SIGNPATH_CERTIFICATE_SUBJECT_NAME}" ]; then
          echo "SIGNPATH_CERTIFICATE_SUBJECT_NAME is not set" >&2
          exit 1
        fi

        cert_path="${RUNNER_TEMP}/signpath-codesign.cer"
        config_path="${RUNNER_TEMP}/signpath-ctk-config.json"
        probe_bin="${RUNNER_TEMP}/signpath-codesign-probe"
        dump_diagnostics() {
          echo "=== security find-identity (all policies) ==="
          security find-identity || true
          echo "=== security find-identity -p codesigning ==="
          security find-identity -p codesigning || true
          echo "=== security find-identity -v -p codesigning ==="
          security find-identity -v -p codesigning || true
          echo "=== security list-smartcard ==="
          security list-smartcard || true
          echo "=== pluginkit ==="
          pluginkit -m -p com.apple.ctk-tokens || true
          pluginkit -m -v -p com.apple.ctk-tokens || true
          echo "=== certificates matching subject ==="
          security find-certificate -a -c "Carvera" || true
          echo "=== SignPathCryptoTokenKit logs ==="
          find "${HOME}/Library/Logs/SignPathCryptoTokenKit" \
            "${HOME}/Library/Containers/io.signpath.apps.CryptoTokenKit/Data/Library/Logs" \
            -type f -print -exec tail -n 80 {} \; 2>/dev/null || true
        }

        echo "Downloading SignPath signing-policy certificate..."
        policies_json="${RUNNER_TEMP}/signpath-policies.json"
        curl --fail --location --show-error \
          --header "Authorization: Bearer ${SIGNPATH_API_TOKEN}" \
          --header "Accept: application/json" \
          --output "${policies_json}" \
          "https://app.signpath.io/api/v1/${SIGNPATH_ORGANIZATION_ID}/Cryptoki/MySigningPolicies?projectSlug=${SIGNPATH_PROJECT_SLUG}&signingPolicySlug=${SIGNPATH_SIGNING_POLICY_SLUG}"

        python3 "${ACTION_PATH}/extract_cert.py" "${policies_json}" "${cert_path}"
        openssl x509 -inform DER -in "${cert_path}" -noout -subject -dates -ext keyUsage,extendedKeyUsage 2>/dev/null \
          || openssl x509 -inform PEM -in "${cert_path}" -noout -subject -dates -ext keyUsage,extendedKeyUsage

        dmg_path="${RUNNER_TEMP}/SignPathCryptoTokenKit.dmg"
        mount_root="${RUNNER_TEMP}/signpath-ctk"
        mkdir -p "${mount_root}"

        curl --fail --location --show-error \
          --output "${dmg_path}" \
          "https://download.signpath.io/cryptoproviders/macos-cryptotokenkit/2-latest/SignPathCryptoTokenKit.dmg"

        hdiutil attach "${dmg_path}" -mountroot "${mount_root}" -nobrowse -quiet

        ctk_app="$(find "${mount_root}" -maxdepth 3 -name 'SignPathCryptoTokenKit.app' -print -quit)"
        if [ -z "${ctk_app}" ]; then
          echo "SignPathCryptoTokenKit.app was not found in the downloaded DMG" >&2
          find "${mount_root}" -maxdepth 4 -print >&2
          exit 1
        fi

        # LaunchServices is more reliable when the app lives in /Applications.
        install_app="/Applications/SignPathCryptoTokenKit.app"
        sudo rm -rf "${install_app}"
        sudo ditto "${ctk_app}" "${install_app}"

        appex="${install_app}/Contents/PlugIns/ctk.appex"
        pluginkit -a "${appex}" || true
        pluginkit -e use -i io.signpath.apps.CryptoTokenKit || true

        python3 "${ACTION_PATH}/write_config.py" "${config_path}"
        chmod 600 "${config_path}"

        # `open` detaches so the app survives this step for later codesign.
        open --env SIGNPATH_CONFIG_FILE="${config_path}" \
          --env SIGNPATH_API_TOKEN="${SIGNPATH_API_TOKEN}" \
          "${install_app}" --args \
          --config "${config_path}" \
          --organization-id "${SIGNPATH_ORGANIZATION_ID}" \
          --project-slug "${SIGNPATH_PROJECT_SLUG}" \
          --signing-policy-slug "${SIGNPATH_SIGNING_POLICY_SLUG}" \
          --api-token "${SIGNPATH_API_TOKEN}"

        echo "Waiting for SignPath smartcard..."
        for _ in $(seq 1 20); do
          if security list-smartcard 2>/dev/null | grep -q 'io.signpath.apps.SignPathCryptoTokenKit'; then
            break
          fi
          sleep 1
        done
        security list-smartcard || true

        # SignPath: loading certificates into the keychain can take up to 20 seconds.
        # Do not restart ctkd here; that drops the token before identities appear.
        sleep 20

        echo "Waiting for codesign to see '${SIGNPATH_CERTIFICATE_SUBJECT_NAME}'..."
        cp /bin/echo "${probe_bin}"
        identity=""
        for _ in $(seq 1 30); do
          if identity="$(python3 "${ACTION_PATH}/find_identity.py")"; then
            echo "Found identity ${identity}"
            break
          fi
          if codesign --force --sign "${SIGNPATH_CERTIFICATE_SUBJECT_NAME}" "${probe_bin}" \
            >/tmp/signpath-codesign-probe.log 2>&1; then
            echo "codesign accepted the certificate Common Name"
            identity="${SIGNPATH_CERTIFICATE_SUBJECT_NAME}"
            break
          fi
          identity=""
          sleep 2
        done

        if [ -z "${identity}" ]; then
          echo "SignPath certificate is not usable by codesign on this runner" >&2
          cat /tmp/signpath-codesign-probe.log 2>/dev/null || true
          dump_diagnostics
          exit 1
        fi

        dump_diagnostics
        echo "Using codesign identity ${identity}"
        echo "codesign-identity=${identity}" >> "${GITHUB_OUTPUT}"
